spring:
  application:
    name: yocabs-api

  datasource:
    url: jdbc:postgresql://localhost:5432/yocabs
    username: yocabs
    password: yocabs_dev

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: never