# Hosted testing. Production-shaped - real database, secrets from the environment, HTTPS in front -
# but deliberately NOT the "prod" profile, because a test deployment still needs two development
# conveniences:
#
#   * one-time codes are written to the log, since no SMS provider is connected. Whoever runs the
#     deployment reads the code and passes it to the tester.
#   * the sandbox payment gateway stays available, so a tester can complete a booking without
#     real money moving. The prod profile refuses to start with it, which is the right guard.
#
# Never point real customers at this profile.

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

server:
  shutdown: graceful
  port: ${PORT:8080}
  tomcat:
    # One line per request in the service log (method, path, status, bytes, time, size sent), so
    # a report such as "the upload fails" can be matched to what the server actually saw. Paths
    # only: no query strings, no headers that carry credentials.
    accesslog:
      enabled: true
      directory: /dev
      prefix: stdout
      suffix: ""
      file-date-format: ""
      buffered: false
      pattern: "ACCESS %m %U %s %b %Dms in=%{Content-Length}i"

management:
  endpoint:
    health:
      show-details: never

yocabs:
  security:
    jwt-secret: ${YOCABS_JWT_SECRET}

  bootstrap-admin:
    email: ${YOCABS_BOOTSTRAP_ADMIN_EMAIL:}
    password: ${YOCABS_BOOTSTRAP_ADMIN_PASSWORD:}

  otp:
    sender: logging
    log-code: true

  cors:
    allowed-origins: ${YOCABS_CORS_ALLOWED_ORIGINS:}

  routing:
    provider: ${YOCABS_ROUTING_PROVIDER:osrm}
    google:
      api-key: ${YOCABS_GOOGLE_ROUTES_API_KEY:}
      traffic-aware: ${YOCABS_GOOGLE_ROUTES_TRAFFIC_AWARE:true}
    osrm:
      base-url: ${YOCABS_OSRM_BASE_URL:https://router.project-osrm.org}

  payment:
    gateway: sandbox
    webhook-secret: ${YOCABS_PAYMENT_WEBHOOK_SECRET:staging-webhook-secret-change-me}

  storage:
    local-path: ${YOCABS_STORAGE_PATH:/var/lib/yocabs/documents}
