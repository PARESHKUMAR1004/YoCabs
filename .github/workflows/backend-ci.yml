name: backend-ci

on:
  push:
    branches: [main]
    paths: ["apps/api/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["apps/api/**", ".github/workflows/backend-ci.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # Integration tests start a throwaway PostgreSQL via Testcontainers (Docker is preinstalled).
      - name: Build and test
        run: ./gradlew --no-daemon build

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: apps/api/build/reports/tests/test
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the jar
        working-directory: apps/api
        run: ./gradlew --no-daemon bootJar

      - name: Build production image
        run: docker build -t yocabs-api:${{ github.sha }} apps/api
